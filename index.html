<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 {
            margin: 0;
        }

        button {
            border: 0;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome p {
            color: #aaa;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .game-card {
            background: #1f2937;
            padding: 25px;
            border-radius: 12px;
        }

        .game-card p {
            color: #aaa;
        }

        .game-card span {
            font-weight: bold;
            color: #3b82f6;
        }

        .game-card button {
            margin-top: 5px;
        }

        .favorite {
            background: #374151;
            color: white;
        }

        .auth-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            color: black;
        }

        .auth-container input {
            width: 90%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .auth-container button {
            width: 95%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-screen">
        <div id="signup-box">
            <h2>Create Account</h2>
            <form id="signup-form">
                <input type="email" id="signup-email" placeholder="Choose an Email" required><br><br>
                <input type="password" id="signup-password" placeholder="Create a Password" required><br><br>
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <div id="login-box">
            <h2>Log In</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Your Email" required><br><br>
                <input type="password" id="login-password" placeholder="Your Password" required><br><br>
                <button type="submit">Log In</button>
            </form>
        </div>
        
        <p id="message-box" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <div id="dashboard-content" style="display: none;">
        <header>
            <h1>Game Dashboard</h1>
            <div>
                <button id="logoutButton" style="background-color: #ef4444; color: white; margin-right: 10px;">Log Out</button>
                <button id="themeButton">Dark Mode</button>
            </div>
        </header>

        <main>
            <section class="games">
                <div class="game-card">
                    <h3 id="game1">Roblox</h3>
                    <p>Top game</p>
                    <p>Playtime: <span id="hours1">0.00</span> hours</p>
                    <button class="favorite">☆ Favorite</button>
                    <button id="timerBtn1" onclick="toggleTimer(0)">▶ Start Playing</button>
                </div>

                <div class="game-card">
                    <h3 id="game2">Minecraft</h3>
                    <p>Top game</p>
                    <p>Playtime: <span id="hours2">0.00</span> hours</p>
                    <button class="favorite">☆ Favorite</button>
                    <button id="timerBtn2" onclick="toggleTimer(1)">▶ Start Playing</button>
                </div>

                <div class="game-card">
                    <h3 id="game3">Hollow Knight</h3>
                    <p>Top game</p>
                    <p>Playtime: <span id="hours3">0.00</span> hours</p>
                    <button class="favorite">☆ Favorite</button>
                    <button id="timerBtn3" onclick="toggleTimer(2)">▶ Start Playing</button>
                </div>
            </section>

            <button id="editGames" style="margin-top: 20px;">Edit Top 3</button>

            <section id="gameSetup" class="setup">
                <h2>Choose your Top 3</h2>
                <input id="gameInput1" type="text" placeholder="Game 1">
                <input id="gameInput2" type="text" placeholder="Game 2">
                <input id="gameInput3" type="text" placeholder="Game 3">
                <button id="saveGames">Save</button>
            </section>
        </main>
    </div>

    <script>
        let games = JSON.parse(localStorage.getItem("games")) || ["Roblox", "Minecraft", "Hollow Knight"];
        let playtimes = JSON.parse(localStorage.getItem("playtimes")) ||;
        let activeTimers = [null, null, null];

        const gameSetup = document.getElementById("gameSetup");
        const editGames = document.getElementById("editGames");
        const saveGames = document.getElementById("saveGames");

        document.getElementById("game1").textContent = games[0];
        document.getElementById("game2").textContent = games[1];
        document.getElementById("game3").textContent = games[2];

        document.getElementById("hours1").textContent = playtimes[0].toFixed(2);
        document.getElementById("hours2").textContent = playtimes[1].toFixed(2);
        document.getElementById("hours3").textContent = playtimes[2].toFixed(2);

        gameSetup.style.display = "none";

        editGames.addEventListener("click", () => {
            gameSetup.style.display = "block";
            document.getElementById("gameInput1").value = games[0];
            document.getElementById("gameInput2").value = games[1];
            document.getElementById("gameInput3").value = games[2];
        });

        saveGames.addEventListener("click", () => {
            let game1 = document.getElementById("gameInput1").value.trim();
            let game2 = document.getElementById("gameInput2").value.trim();
            let game3 = document.getElementById("gameInput3").value.trim();

            if (!game1 || !game2 || !game3) {
                return;
            }

            games = [game1, game2, game3];
            localStorage.setItem("games", JSON.stringify(games));

            document.getElementById("game1").textContent = games[0];
            document.getElementById("game2").textContent = games[1];
            document.getElementById("game3").textContent = games[2];

            gameSetup.style.display = "none";
        });

        let favoriteButtons = document.querySelectorAll(".favorite");
        let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

        favoriteButtons.forEach((button, index) => {
            if (favorites.includes(index)) {
                button.textContent = "★ Favorited";
            }

            button.addEventListener("click", () => {
                if (favorites.includes(index)) {
                    favorites = favorites.filter((item) => item !== index);
                    button.textContent = "☆ Favorite";
                } else {
                    favorites.push(index);
                    button.textContent = "★ Favorited";
                }
                localStorage.setItem("favorites", JSON.stringify(favorites));
            });
        });

        function toggleTimer(index) {
            let btn = document.getElementById("timerBtn" + (index + 1));
            let display = document.getElementById("hours" + (index + 1));
            
            if (activeTimers[index] === null) {
                activeTimers[index] = Date.now();
                btn.textContent = "⏹ Stop Playing";
                btn.style.backgroundColor = "#ef4444";
                btn.style.color = "white";
            } else {
                let startTime = activeTimers[index];
                let endTime = Date.now();
                let msElapsed = endTime - startTime;
                let hoursElapsed = msElapsed / (1000 * 60 * 60);
                
                playtimes[index] += hoursElapsed;
                localStorage.setItem("playtimes", JSON.stringify(playtimes));
                display.textContent = playtimes[index].toFixed(2);
                
                activeTimers[index] = null;
                btn.textContent = "▶ Start Playing";
                btn.style.backgroundColor = "";
                btn.style.color = "";
            }
        }

        document.getElementById("themeButton").addEventListener("click", () => {
            if (document.body.style.background === "rgb(17, 24, 39)" || document.body.style.background === "") {
                document.body.style.background = "#ffffff";
                document.body.style.color = "#000000";
            } else {
                document.body.style.background = "#111827";
                document.body.style.color = "#ffffff";
            }
        });

        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
const messageBox = document.getElementById('message-box');
if (localStorage.getItem(email)) {
messageBox.textContent = "❌ An account with this email already exists.";
messageBox.style.color = "red";
return;
}
localStorage.setItem(email, password);
messageBox.textContent = "🎉 Account created! Now try logging in below.";
messageBox.style.color = "green";
document.getElementById('signup-form').reset();
});
document.getElementById('login-form').addEventListener('submit', function(e) {
e.preventDefault();
const email = document.getElementById('login-email').value;
const password = document.getElementById('login-password').value;
const messageBox = document.getElementById('message-box');
const savedPassword = localStorage.getItem(email);
if (savedPassword && savedPassword === password) {
messageBox.textContent = "🎉 Welcome back! You are logged in.";
messageBox.style.color = "green";
document.getElementById('auth-screen').style.display = 'none';
document.getElementById('dashboard-content').style.display = 'block';
} else {
messageBox.textContent = "❌ Invalid email or password.";
messageBox.style.color = "red";
}
});
document.getElementById('logoutButton').addEventListener('click', () => {
document.getElementById('dashboard-content').style.display = 'none';
document.getElementById('auth-screen').style.display = 'block';
document.getElementById('login-form').reset();
document.getElementById('message-box').textContent = "";
});
